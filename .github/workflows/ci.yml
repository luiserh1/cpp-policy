# cpp-policy's own CI: its self-test through the same reusable gate projects use.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      # The self-test builds a small vcpkg project (tests/vcpkg_triplets) and the template's
      # --vcpkg variant.
      vcpkg: true
