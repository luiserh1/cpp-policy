# cpp-policy's own CI: its self-test through the same reusable gate projects use.
name: CI

on:
  # Branches only: a release is tagged on a commit whose run was green, so a tag push
  # would run the same commit again (POLICY.md 8).
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      # The self-test builds a small vcpkg project (tests/vcpkg_triplets) and a project from
      # the template, which uses vcpkg for doctest.
      vcpkg: true
