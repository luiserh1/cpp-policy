# The policy gate in CI (POLICY.md 8): the check, tsan and release workflows on each system.
# Reusable: cpp-policy's own CI calls it, and projects call it pinned to the same commit as
# their FetchContent GIT_TAG:
#
#   jobs:
#     gate:
#       uses: luiserh1/cpp-policy/.github/workflows/gate.yml@<commit> # v<version>
#       with:
#         systems: '["linux", "windows"]'
#         vcpkg: true
#         self_hosted: '["macos"]'
#       secrets:
#         library_token: ${{ secrets.LIBRARY_TOKEN }}   # only with a library in a private repository
#
# Systems listed in self_hosted run on the owner's own machine instead of GitHub's: a
# repository runner with the default labels "self-hosted" and the system's name ("macOS",
# "Linux", "Windows"). Its minutes are free. A job waits while the machine is off, and GitHub
# fails it after 24 hours in the queue. The gate installs and resets nothing there: it uses
# the machine's LLVM, CMake and Ninja as they are, and a vcpkg copy of its own in the runner's
# tool folder (never the owner's VCPKG_ROOT). A self-hosted Windows machine must have the
# Microsoft toolset MSVC_TOOLSET names, and the job stops if it doesn't; GitHub's Windows image
# brings its own, newer one (POLICY.md 1).
#
# Every download is pinned: actions by commit, the Linux apt key by fingerprint, the Windows
# LLVM archive by SHA-256. Change LLVM_VERSION and the hash together. A change to LLVM_VERSION
# or MSVC_TOOLSET means the self-hosted machines must be upgraded before projects pin it.
name: gate

on:
  workflow_call:
    inputs:
      systems:
        description: 'JSON list of systems to run on: "linux", "windows", "macos"'
        type: string
        default: '["linux", "windows", "macos"]'
      vcpkg:
        description: The project uses vcpkg (sets VCPKG_ROOT to the runner's copy)
        type: boolean
        default: false
      self_hosted:
        description: 'JSON list of systems that run on the owner''s self-hosted runners instead of GitHub''s'
        type: string
        default: '[]'
    secrets:
      library_token:
        description: >-
          A token that can read the private repositories of the libraries this project uses
          (POLICY.md 11.7). Not needed when they are public, or when there are none.
        required: false

permissions:
  contents: read

# A newer push makes an older run of the same branch obsolete. On the default branch the run
# in progress always finishes, and only runs still waiting behind it are replaced by the
# newest; on any other branch the older run is stopped. Each tag is a ref of its own, so a
# release's run is never cancelled. The group is evaluated for the calling workflow: its name
# starts with this workflow's, so that two cpp-policy workflows called from one CI file
# don't share a group and cancel each other.
concurrency:
  group: cpp-policy-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  LLVM_VERSION: 23.1.2
  LLVM_MAJOR: 23
  # clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz, from the release's asset digest.
  LLVM_WINDOWS_SHA256: 8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095
  # apt.llvm.org signing key.
  LLVM_APT_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
  # The Microsoft toolset (MSVC libraries, standard library and runtime) of self-hosted Windows
  # runners, major.minor: 14.44 is Visual Studio 2022 17.14, which only gets servicing updates.
  MSVC_TOOLSET: '14.44'

jobs:
  gate:
    name: ${{ matrix.system }} ${{ matrix.workflow }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
        workflow: [check, tsan, release]
        exclude:
          # ThreadSanitizer isn't available with clang-cl (POLICY.md 7.3).
          - system: windows
            workflow: tsan
    runs-on: >-
      ${{ contains(fromJSON(inputs.self_hosted), matrix.system)
       && fromJSON(format('["self-hosted", "{0}"]', matrix.system == 'linux' && 'Linux'
                                                  || matrix.system == 'windows' && 'Windows'
                                                  || 'macOS'))
       || matrix.system == 'linux' && 'ubuntu-24.04'
       || matrix.system == 'windows' && 'windows-2025'
       || 'macos-15' }}
    timeout-minutes: 45
    env:
      # 'true' on the owner's machine: nothing is installed or reset there.
      SELF_HOSTED: ${{ contains(fromJSON(inputs.self_hosted), matrix.system) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A library this project uses (cpp_policy_use_library, POLICY.md 11.7) may be in a
      # private repository. The owner's token for it is given to git for this job only, as a
      # header sent to those repositories' addresses and to no other: nothing is written to
      # the runner's git configuration, and no address carries the token.
      - name: Let git fetch the libraries this project uses
        env:
          LIBRARY_TOKEN: ${{ secrets.library_token }}
        run: |
          urls=$(awk '/cpp_policy_use_library[ \t]*\(/ { inside = 1 }
                      inside && /GIT_REPOSITORY/ { for (i = 1; i < NF; i++) if ($i == "GIT_REPOSITORY") print $(i + 1) }
                      inside && /GIT_TAG/ { inside = 0 }' CMakeLists.txt)
          if [ -z "$urls" ]; then
            echo "This project uses no library."
            exit 0
          fi
          echo "Libraries: $urls"
          if [ -z "$LIBRARY_TOKEN" ]; then
            echo "::notice::No library_token secret was passed: a library in a private repository can't be fetched."
            exit 0
          fi
          encoded=$(printf 'x-access-token:%s' "$LIBRARY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$encoded"
          count=0
          for url in $urls; do
            case $url in
              https://github.com/*) ;;
              *) echo "::warning::$url isn't a https://github.com/ address; the token isn't used for it."; continue ;;
            esac
            echo "GIT_CONFIG_KEY_$count=http.$url.extraheader" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_$count=AUTHORIZATION: basic $encoded" >> "$GITHUB_ENV"
            count=$((count + 1))
          done
          echo "GIT_CONFIG_COUNT=$count" >> "$GITHUB_ENV"

      - name: Install LLVM (Linux)
        if: matrix.system == 'linux' && env.SELF_HOSTED != 'true'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          gpg --show-keys --with-colons llvm.asc | grep -q "fpr:::::::::${LLVM_APT_KEY_FINGERPRINT}:" \
            || { echo "apt.llvm.org key fingerprint mismatch"; exit 1; }
          sudo install -m 644 llvm.asc /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          # llvm-N: llvm-strip and llvm-size, for size budgets (POLICY.md 13.5).
          sudo apt-get install -y -q ninja-build "clang-${LLVM_MAJOR}" "clang-tidy-${LLVM_MAJOR}" \
            "clang-format-${LLVM_MAJOR}" "libclang-rt-${LLVM_MAJOR}-dev" "llvm-${LLVM_MAJOR}"

      - name: Install LLVM (Windows)
        if: matrix.system == 'windows' && env.SELF_HOSTED != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          Invoke-WebRequest $url -OutFile llvm.tar.xz
          if ((Get-FileHash llvm.tar.xz -Algorithm SHA256).Hash -ne $env:LLVM_WINDOWS_SHA256) {
            throw "LLVM archive SHA-256 mismatch"
          }
          # The image ships an older LLVM in the path the presets use; replace it.
          $dir = "C:\Program Files\LLVM"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory $dir | Out-Null
          tar -xf llvm.tar.xz -C $dir --strip-components=1
          Remove-Item llvm.tar.xz
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Install LLVM (macOS)
        if: matrix.system == 'macos' && env.SELF_HOSTED != 'true'
        # Homebrew's llvm moves to a new major days after its release, and the major the policy
        # pins then stays available as llvm@<major> (POLICY.md 10.1).
        run: |
          stable=$(brew info --json=v2 --formula llvm | jq -r '.formulae[0].versions.stable')
          if [ "${stable%%.*}" = "$LLVM_MAJOR" ]; then
            brew install llvm ninja
          else
            brew install "llvm@${LLVM_MAJOR}" ninja
          fi

      # The PATH the presets give the build, so this shows the LLVM the build will use (on a
      # self-hosted Linux machine it may be the system's, e.g. /usr/bin on Arch).
      - name: Show the toolchain
        run: |
          if [ "${{ matrix.system }}" = windows ]; then
            PATH="/c/Program Files/LLVM/bin:$PATH"
          else
            PATH="/opt/homebrew/opt/llvm/bin:/usr/local/opt/llvm/bin:/usr/lib/llvm-${LLVM_MAJOR}/bin:$PATH"
            # llvm@<major> in front of the rest, as in the presets.
            PATH="/opt/homebrew/opt/llvm@${LLVM_MAJOR}/bin:/usr/local/opt/llvm@${LLVM_MAJOR}/bin:$PATH"
          fi
          clang-tidy --version
          cmake --version
          ninja --version
          # The standard library the build reads: some clang-tidy findings depend on it.
          if [ "${{ matrix.system }}" = windows ]; then
            # The MSVC toolset clang-cl finds, from the include paths it passes to itself.
            echo 'int main() {}' > toolset-probe.cpp
            msvc=$(clang-cl -### -c toolset-probe.cpp 2>&1 \
              | sed -n 's/.*MSVC[\\/]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
            msvc=${msvc%%$'\n'*}
            rm -f toolset-probe.cpp
            echo "MSVC toolset: ${msvc:-not found}"
            if [ "$SELF_HOSTED" = true ] && [ "${msvc%.*}" != "$MSVC_TOOLSET" ]; then
              echo "This runner's MSVC toolset is ${msvc:-missing}; the gate pins $MSVC_TOOLSET" \
                "(MSVC_TOOLSET in gate.yml, POLICY.md 1). Install that toolset, and only that one."
              exit 1
            fi
          else
            printf '#include <version>\n' | clang++ -x c++ -std=c++23 -dM -E - \
              | grep -E '#define (_LIBCPP_VERSION|_GLIBCXX_RELEASE|__GLIBCXX__) ' \
              || echo "Standard library version: not found"
          fi

      # The runner image's vcpkg is a checkout from when the image was built. Move it to the
      # manifest's builtin-baseline, as on a developer's machine: vcpkg reads port versions
      # from the checked-out files, so fetching alone leaves newer versions unknown. Without a
      # vcpkg.json (cpp-policy's own self-test, whose vcpkg project only uses a local port and
      # vcpkg's build helpers) the copy stays at its commit.
      - name: Use the runner's vcpkg at the manifest's baseline
        if: inputs.vcpkg
        run: |
          baseline=""
          if [ -f vcpkg.json ]; then
            baseline=$(sed -n 's/.*"builtin-baseline"[^"]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
            if [ -z "$baseline" ]; then echo "vcpkg.json has no builtin-baseline commit"; exit 1; fi
          fi
          if [ "$SELF_HOSTED" = true ]; then
            # A copy of the runner's own, kept between jobs: the owner's vcpkg is left alone.
            root=$RUNNER_TOOL_CACHE/cpp-policy-vcpkg
            if [ ! -d "$root/.git" ]; then
              git clone --quiet https://github.com/microsoft/vcpkg.git "$root"
            fi
          else
            root=$VCPKG_INSTALLATION_ROOT
          fi
          if [ -n "$baseline" ]; then
            git -C "$root" fetch --quiet origin
            # --force: the image may have changed files in its copy; the job owns it.
            git -C "$root" -c advice.detachedHead=false checkout --quiet --force "$baseline"
          fi
          if [ "${{ matrix.system }}" = windows ]; then
            pwsh -NoProfile -Command "& '$root\bootstrap-vcpkg.bat' -disableMetrics"
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Run the ${{ matrix.workflow }} workflow
        run: |
          preset=${{ matrix.workflow }}
          if [ "${{ matrix.system }}" = windows ]; then preset=win-$preset; fi
          cmake --workflow --preset "$preset"
